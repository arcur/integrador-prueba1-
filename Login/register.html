<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStore - Registro</title>
  <link rel="stylesheet" href="../css/registro.css">
   
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

</head>
<body>
    <img src="../imagenes/techstore-Photoroom.png" alt="Logo Empresa" class="logo-empresa">

  <div class="auth-container">
        <div class="auth-box">
            <h2>Crear Cuenta</h2>
            
            <!-- CLAVE: ID DEL FORMULARIO -->
            <form id="registroForm"> 
                
                <!-- CLAVE: DIV PARA MENSAJES -->
                <div id="mensajeRegistro" class="alert" style="display:none;"></div>

                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <!-- CLAVE: ATRIBUTO name="nombre" -->
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required
                        oninput="soloLetrasYEspacios(event)">
                </div>
                <div class="form-group">
                    <label for="apellido_paterno">Apellido Paterno</label>
                    <!-- CLAVE: ATRIBUTO name="apellidoPaterno" -->
                    <input type="text" id="apellido_paterno" name="apellidoPaterno" placeholder="Tu apellido paterno" required
                        oninput="soloLetrasYEspacios(event)">
                </div>
                <div class="form-group">
                    <label for="apellido_materno">Apellido Materno</label>
                    <!-- CLAVE: ATRIBUTO name="apellidoMaterno" -->
                    <input type="text" id="apellido_materno" name="apellidoMaterno" placeholder="Tu apellido materno" required
                        oninput="soloLetrasYEspacios(event)">
                </div>
                <div class="form-group">
                    <label for="dni">Número de DNI</label>
                    <!-- CLAVE: ATRIBUTO name="numeroDni" -->
                    <input type="text" id="dni" name="numeroDni" placeholder="8 dígitos" maxlength="8" required
                        oninput="soloNumerosYLongitud(event, 8)">
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <!-- CLAVE: ATRIBUTO name="telefono" -->
                    <input type="text" id="telefono" name="telefono" placeholder="Ej: 987654321" required
                        oninput="soloNumerosYLongitud(event, 9)">
                </div>
                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <!-- CLAVE: ATRIBUTO name="correo" -->
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@email.com" required
                        oninput="sinEspacios(event)">
                </div>
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <!-- CLAVE: ATRIBUTO name="nombreUsuario" -->
                    <input type="text" id="usuario" name="nombreUsuario" placeholder="Nombre de usuario" required
                        oninput="sinEspacios(event)">
                </div>
                <div class="form-group relative-parent">
                    <label for="password">Contraseña</label>
                    <!-- CLAVE: ATRIBUTO name="password" -->
                    <input type="password" id="password" name="password" placeholder="••••••••" required
                        oninput="sinEspacios(event)">
                    <i class="fas fa-eye-slash toggle-password" onclick="togglePassword()"></i>
                </div>
                <button type="submit" class="btn">Registrarse</button>
                <p class="switch">
                    ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
                </p>
            </form>
        </div>
    </div>
<script src="../js/registro.js"></script>
</body>

</html>
