<!DOCTYPE html>
<html lang="es" data-bs-theme="dark"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Configuración</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="css/style_base.css"> 
</head>
<body>

    <div class="container-fluid">
        <div class="row">
            <div class="col-auto px-0">
                <div id="sidebar-placeholder"></div>
            </div>

            <div class="col py-3">
                <header class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
                    <h1 class="futuristic-title fs-4">                </h1>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="theme-toggle">
                        <label class="form-check-label" for="theme-toggle">☀️ Modo Claro</label>
                    </div>
                </header>

                <main>
                    <h2 class="futuristic-title mb-4">Configuración de Cuenta ⚙️</h2>

                    <div class="row">
                        <div class="col-lg-6 mb-4">
                            <div class="card bg-secondary border-0 h-100">
                                <div class="card-body">
                                    <h5 class="card-title mb-3">Datos Personales</h5>
                                    <form>
                                        <div class="mb-3">
                                            <label for="fullName" class="form-label">Nombre Completo</label>
                                            <input type="text" class="form-control" id="fullName" value="Juan Pérez">
                                        </div>
                                        <div class="mb-3">
                                            <label for="email" class="form-label">Correo Electrónico</label>
                                            <input type="email" class="form-control" id="email" value="juan.perez@email.com" readonly disabled>
                                        </div>
                                        <div class="mb-3">
                                            <label for="phone" class="form-label">Número de Teléfono</label>
                                            <input type="tel" class="form-control" id="phone" value="+51 987 654 321">
                                        </div>
                                        <button type="submit" class="btn btn-primary mt-2">Guardar Cambios</button>
                                    </form>
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-6 mb-4">
                            <div class="card bg-secondary border-0 h-100">
                                <div class="card-body">
                                    <h5 class="card-title mb-3">Seguridad</h5>
                                    <form>
                                        <div class="mb-3">
                                            <label for="passCurrent" class="form-label">Contraseña Actual</label>
                                            <input type="password" class="form-control" id="passCurrent" placeholder="Ingresa tu contraseña actual">
                                        </div>
                                        <div class="mb-3">
                                            <label for="passNew" class="form-label">Nueva Contraseña</label>
                                            <input type="password" class="form-control" id="passNew" placeholder="Mínimo 8 caracteres">
                                        </div>
                                        <div class="mb-3">
                                            <label for="passConfirm" class="form-label">Confirmar Nueva Contraseña</label>
                                            <input type="password" class="form-control" id="passConfirm" placeholder="Repite la nueva contraseña">
                                        </div>
                                        <button type="submit" class="btn btn-primary mt-2">Cambiar Contraseña</button>
                                    </form>
                                </div>
                            </div>
                        </div>

                        <div class="col-12 mb-4">
                            <div class="card bg-secondary border-0">
                                <div class="card-body">
                                    <h5 class="card-title mb-3">Direcciones de Envío</h5>
                                    
                                    <div class="p-3 rounded border-start border-primary border-4 mb-3" style="background-color: var(--bs-body-bg);">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <div>
                                                <h6 class="mb-0">Dirección Principal (Predeterminada)</h6>
                                                <p class="mb-0 text-body-secondary">Av. La Tecnología 404, Urb. Cyber, Lima, Perú</p>
                                            </div>
                                            <div>
                                                <button class="btn btn-sm btn-outline-secondary">Editar</button>
                                                <button class="btn btn-sm btn-outline-danger ms-2">Eliminar</button>
                                            </div>
                                        </div>
                                    </div>

                                    <button class="btn btn-outline-primary mt-2">
                                        <i class="bi bi-plus-lg"></i> Agregar Nueva Dirección
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="js/app_sidebar_bootstrap.js"></script>

</body>
</html>
