<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Mis Favoritos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="css/style_base.css"> 
</head>
<body>

    <div class="container-fluid">
        <div class="row">
            <div class="col-auto px-0">
                <div id="sidebar-placeholder"></div>
            </div>

            <div class="col py-3">
                <header class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
                    <h1 class="futuristic-title fs-4">          </h1>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="theme-toggle">
                        <label class="form-check-label" for="theme-toggle">☀️ Modo Claro</label>
                    </div>
                </header>

                <main>
                    <h2 class="futuristic-title mb-4">Mis Productos Favoritos <i class="bi bi-heart-fill text-danger"></i></h2>

                    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4">
                        
                        <div class="col">
                            <div class="card bg-secondary border-0 h-100">
                                <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Producto Favorito">
                                <div class="card-body d-flex flex-column">
                                    <h5 class="card-title">Procesador Ryzen 5 5600X</h5>
                                    <p class="card-text text-white-50 small">Añadido el 15 Oct, 2025</p>
                                    <p class="card-text fs-5 fw-bold mt-auto" style="color: #e94560;">S/ 499.99</p>
                                    <div class="d-flex justify-content-between mt-2">
                                        <a href="#" class="btn btn-sm btn-primary">Ver Producto</a>
                                        <button class="btn btn-sm btn-outline-danger" title="Eliminar de Favoritos">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col">
                            <div class="card bg-secondary border-0 h-100">
                                <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Producto Favorito">
                                <div class="card-body d-flex flex-column">
                                    <h5 class="card-title">Teclado Keychron Q2</h5>
                                    <p class="card-text text-white-50 small">Añadido el 18 Oct, 2025</p>
                                    <p class="card-text fs-5 fw-bold mt-auto" style="color: #e94560;">S/ 150.50</p>
                                    <div class="d-flex justify-content-between mt-2">
                                        <a href="#" class="btn btn-sm btn-primary">Ver Producto</a>
                                        <button class="btn btn-sm btn-outline-danger" title="Eliminar de Favoritos">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col">
                             <div class="card bg-secondary border-0 h-100">
                                <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Producto Favorito">
                                <div class="card-body d-flex flex-column">
                                    <h5 class="card-title">Monitor Gamer 27"</h5>
                                    <p class="card-text text-white-50 small">Añadido el 24 Oct, 2025</p>
                                    <p class="card-text fs-5 fw-bold mt-auto" style="color: #e94560;">S/ 850.00</p>
                                    <div class="d-flex justify-content-between mt-2">
                                        <a href="#" class="btn btn-sm btn-primary">Ver Producto</a>
                                        <button class="btn btn-sm btn-outline-danger" title="Eliminar de Favoritos">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        </div> </main>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="js/app_sidebar_bootstrap.js"></script>

</body>
</html>
