<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login de Prueba - TechStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style_base.css"> 
    
    <style>
        /* Estilos básicos para centrar el formulario */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #101418; /* Fondo oscuro base s*/
        }
        .login-box {
            max-width: 400px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="login-box card bg-secondary p-4 shadow">
        <h2 class="text-center mb-4 futuristic-title">Iniciar Sesión (Prueba)</h2>
        
        <div id="error-message" class="alert alert-danger d-none" role="alert">
            Usuario o contraseña incorrectos.
        </div>

        <form id="login-form">
    <div class="mb-3">
        <label for="username" class="form-label">Usuario o Correo</label>
        {/**/}
        <input type="text" class="form-control" id="username" name="username" required> 
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        {/**/}
        <input type="password" class="form-control" id="password" name="password" required> 
    </div>
    <button type="submit" class="btn btn-primary w-100">Ingresar</button>
</form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const loginForm = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');

        loginForm.addEventListener('submit', function(event) {
            // 1. Prevent default form submission
            event.preventDefault(); 
            
            // 2. Hide previous error messages
            errorMessage.classList.add('d-none');
            errorMessage.textContent = ''; // Clear previous message text

            // 3. Get form data
            const formData = new FormData(loginForm);

            // 4. Send data to the backend using fetch (POST)
            fetch('login_backend.php', { // URL of your PHP script
                method: 'POST',
                body: formData // Send form data directly
            })
            .then(response => {
                // Check if the response status is OK (200-299)
                if (!response.ok) {
                    throw new Error('Network response was not ok: ' + response.statusText);
                }
                return response.json(); // Parse the JSON response from PHP
            })
            .then(data => {
                // 5. Process the response from the backend
                console.log("Respuesta del backend:", data); // For debugging
                
                if (data.success === true) {
                    // LOGIN SUCCESSFUL
                    console.log("Login exitoso. Redirigiendo...");
                    // Optional: Store user name if needed on the next page (using localStorage)
                    if (data.userName) {
                        localStorage.setItem('loggedInUserName', data.userName);
                    }
                    // Redirect to the intranet page
                    window.location.href = 'intranet_usu.html'; 
                } else {
                    // LOGIN FAILED
                    console.log("Login fallido:", data.message);
                    errorMessage.textContent = data.message || 'Usuario o contraseña incorrectos.'; // Show message from backend
                    errorMessage.classList.remove('d-none');
                }
            })
            .catch(error => {
                // Handle network errors or issues parsing JSON
                console.error('Error durante el login:', error);
                errorMessage.textContent = 'Ocurrió un error al intentar iniciar sesión. Intente más tarde.';
                errorMessage.classList.remove('d-none');
            });
        });
    </script>

</body>
</html>
